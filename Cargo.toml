[package]
name = "xilem_baseview"
version = "0.2.2"
edition = "2021"
authors = ["Jacek Wisniowski"]
license = "Apache-2.0"
description = "Xilem reactive UI for audio plugins via baseview"
repository = "https://github.com/baltobor/xilem_baseview.git"
keywords = ["gui", "audio", "plugin", "vst", "clap"]
categories = ["gui", "multimedia::audio"]

[dependencies]
# Xilem view layer. Tracks linebender/xilem's main branch; Cargo.lock pins
# the exact resolved commit for reproducible builds - bump with
# `cargo update -p xilem_masonry -p masonry` when picking up upstream fixes.
xilem_masonry = { git = "https://github.com/linebender/xilem", branch = "main" }

# Masonry widget toolkit (same repo/branch as xilem_masonry)
masonry = { git = "https://github.com/linebender/xilem", branch = "main" }

# Masonry's own render pipeline (PreparedFrame + ImagingRenderer), the same
# one masonry_winit uses. Renders masonry's VisualLayerPlan output correctly
# including the paint-time scale-factor transform
masonry_imaging = { git = "https://github.com/linebender/xilem", branch = "main", default-features = false, features = ["imaging_vello"] }

# Version must match masonry_imaging's internally-selected wgpu (currently
# 28.0.0, matching linebender/xilem's workspace pin) - masonry_winit itself
# depends on wgpu directly the same way, since masonry_imaging doesn't
# re-export it.
wgpu = "28.0.0"

# Baseview for plugin windowing
baseview = { git = "https://github.com/baltobor/baseview" }

# Raw window handle - use same version as baseview
raw-window-handle = "0.6"

# Keyboard handling - use same version as baseview
keyboard-types = "0.8"

# Logging
tracing = "0.1"

# Blocking GPU init
pollster = "0.4"

# Async runtime for task/worker views
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "time", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Setting the embedded NSView's CAMetalLayer.contentsScale, so a
# physical-pixel-resolution wgpu surface presents crisply on Retina
# displays instead of being upscaled from a logical-point-sized buffer.
objc = "0.2"

[dev-dependencies]
tracing-subscriber = "0.3"
xilem_synth_widgets = { git = "https://github.com/baltobor/xilem_synth_widgets", branch = "main" }

[[example]]
name = "hello"
path = "examples/hello.rs"

[[example]]
name = "synth_widgets"
path = "examples/synth_widgets.rs"
